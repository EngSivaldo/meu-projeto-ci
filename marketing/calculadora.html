<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Dívida - CI/CD</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px; background: #eef2f3; }
        .box { background: white; padding: 25px; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .res { margin-top: 20px; font-weight: bold; color: #2c3e50; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Calculadora Financeira 💰</h3>
        <input type="number" id="valor" placeholder="Valor Inicial (R$)">
        <input type="number" id="taxa" placeholder="Juros Mensais (%)">
        <input type="number" id="tempo" placeholder="Quantidade de Meses">
        <button onclick="executar()">Calcular Valor Final</button>
        <div class="res" id="res"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function executar() {
            const v = parseFloat(document.getElementById('valor').value);
            const t = parseFloat(document.getElementById('taxa').value);
            const m = parseFloat(document.getElementById('tempo').value);
            const display = document.getElementById('res');

            const total = calcularDivida(v, t, m);
            display.innerText = total > 0 ? `Total a pagar: R$ ${total.toLocaleString('pt-BR')}` : 'Erro nos dados!';
        }
    </script>
</body>
</html>
